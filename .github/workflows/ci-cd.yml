name: CI/CD

on:
  push:
    branches: [master]
  workflow_dispatch: # 允许在 GitHub 页面手动触发

# 防止多次 push 导致部署互相覆盖
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: pip install -r backend/requirements.txt

      - name: 运行 pytest
        run: python -m pytest test/ -q

  deploy:
    name: 部署到服务器
    needs: test # 测试通过才部署
    runs-on: ubuntu-latest
    steps:
      # 分步执行：先构建，构建成功后才停旧服务，最后起新服务。
      # 停止必须独立成一步——若与 nohup 启动同处一个脚本，脚本自身的命令行
      # 会包含 "uvicorn" 文本，pkill -f 会把执行脚本的 shell 一起杀掉。
      - name: SSH 拉取代码并构建前端
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /srv/projects/arknights-rag
            git pull origin master
            cd frontend
            npm install
            npm run build

      - name: SSH 停止旧服务
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            pkill -f "[u]vicorn backend.main" || true
            sleep 1

      - name: SSH 启动新服务并健康检查
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /srv/projects/arknights-rag
            nohup python3 -m uvicorn backend.main:app --host 0.0.0.0 --port 8889 > /tmp/uvicorn.log 2>&1 &
            for i in $(seq 1 6); do
              curl -fsS http://localhost:8889/health && break
              sleep 5
            done

      - name: 外部健康检查
        run: curl -fsS --max-time 15 https://ninimu.top:14606/health
